name: Bug report
description: A wrong answer, a failing or missing test case, or a typo in a solution
labels: [bug]
body:
  - type: input
    id: problem
    attributes:
      label: Problem
      description: The LeetCode slug, for example `two-sum`.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Include an input that fails, the expected result and the actual one.
    validations:
      required: true
  - type: input
    id: racket
    attributes:
      label: Racket version
      description: The output of `racket --version`.
